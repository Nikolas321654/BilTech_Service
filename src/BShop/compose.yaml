services:
  shop-db:
    image: postgres:17-alpine
    container_name: bshop-shop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ShopDb
    ports:
      - "5432:5432"
    volumes:
      - bshop_db-data:/var/lib/postgresql/data

  shop-api:
    image: bshop-shop-api
    container_name: bshop-api
    build:
      context: .
      dockerfile: BShop.Api/Dockerfile
    environment:
      - ConnectionStrings__ShopDbContext=Host=shop-db;Port=5432;Database=ShopDb;Username=postgres;Password=123456
    depends_on:
      - shop-db
    ports:
      - "8080:8080"

volumes:
  bshop_db-data: